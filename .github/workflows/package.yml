name: package

# Builds the release archives. release.yml calls it with snapshot: false on
# v* tags (publishes the GitHub Release); ci.yml calls it with snapshot: true
# so every change exercises the same path and uploads the archives as an artifact.
on:
  workflow_call:
    inputs:
      snapshot:
        type: boolean
        required: true

# The caller grants the token (read in CI, contents: write for releases). Only
# the goreleaser job inherits it; every other job is limited to read.
jobs:
  ffmpeg-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: cache
        if: inputs.snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/macos
          key: ffmpeg-macos-${{ hashFiles('packaging/macos/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/macos/build-ffmpeg.sh third_party/macos
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Pipeline tests against the bundled ffmpeg only
        shell: bash
        run: |
          set -euo pipefail
          lipo -info third_party/macos/ffmpeg
          dir=$(mktemp -d)
          cp third_party/macos/ffmpeg "$dir/"
          go test -c -o "$dir/media.test" ./internal/media
          cd "$dir" && PATH=/usr/bin:/bin ./media.test -test.v -test.run FFmpeg | tee test.log
          ! grep -q -- "--- SKIP" test.log
          grep -q -- "--- PASS" test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-macos
          path: third_party/macos
          retention-days: 1

  ffmpeg-windows:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: cache
        if: inputs.snapshot
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/windows
          key: ffmpeg-windows-${{ hashFiles('packaging/windows/build-ffmpeg.sh', 'packaging/windows/ffmpeg.manifest') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 >/dev/null
          packaging/windows/build-ffmpeg.sh third_party/windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-windows
          path: third_party/windows
          retention-days: 1

  windows-pipeline:
    permissions:
      contents: read
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - name: Pipeline tests against the bundled ffmpeg only
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cp third_party/windows/ffmpeg.exe "$dir/"
          go test -c -o "$dir/media.test.exe" ./internal/media
          go test -c -o "$dir/server.test.exe" ./internal/server
          cd "$dir"
          PATH=/usr/bin:/bin ./media.test.exe -test.v | tee test.log
          PATH=/usr/bin:/bin ./server.test.exe -test.v -test.run TestStreamsVideo | tee -a test.log
          ! grep -q -- "--- SKIP" test.log
          grep -q -- "--- PASS: TestPipelineCapturesPrimaryMonitor" test.log
          grep -q -- "--- PASS: TestStreamsVideo" test.log
      - name: A second host refuses to start
        shell: bash
        run: |
          set -euo pipefail
          go build -o spareglass.exe ./cmd/spareglass
          ./spareglass.exe serve -addr 127.0.0.1:0 </dev/null >first.log 2>&1 &
          first=$!
          trap 'kill "$first" 2>/dev/null || true; echo "--- first host"; cat first.log' EXIT
          for _ in $(seq 50); do grep -q "spareglass is running" first.log && break; sleep 0.2; done
          grep -q "spareglass is running" first.log
          if ./spareglass.exe serve -addr 127.0.0.1:0 </dev/null >second.log 2>&1; then
            echo "second host started"; cat second.log; exit 1
          fi
          cat second.log
          grep -q "already running" second.log
      - name: A host started without a console leaves the driver setup alone
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p driver
          cp spareglass.exe driver/VirtualDisplayDriver-setup.exe
          ./spareglass.exe serve -addr 127.0.0.1:0 </dev/null >serve.log 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true; cat serve.log' EXIT
          for _ in $(seq 50); do grep -q "spareglass is running" serve.log && break; sleep 0.2; done
          grep -q "spareglass is running" serve.log
          ! grep -q "Installing the Virtual Display Driver" serve.log

  windows-vdd:
    permissions:
      contents: read
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - name: Fetch the Virtual Display Driver shipped in the archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/windows/fetch-vdd.sh "$RUNNER_TEMP/vdd"
      - name: First run installs the Virtual Display Driver (serve in its own console)
        shell: pwsh
        run: |
          # A space and non-ASCII characters, as in real download paths.
          $dir = Join-Path $env:RUNNER_TEMP "sg テスト"
          New-Item -ItemType Directory -Force "$dir\driver" | Out-Null
          go build -o "$dir\spareglass.exe" ./cmd/spareglass
          if ($LASTEXITCODE) { exit 1 }
          Copy-Item (Join-Path $env:RUNNER_TEMP "vdd\VirtualDisplayDriver-setup.exe") "$dir\driver\"
          $frames = Join-Path $env:GITHUB_WORKSPACE "vdd-frames"
          New-Item -ItemType Directory -Force $frames | Out-Null

          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes, System.Windows.Forms, System.Drawing
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Mouse { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, int dx, int dy, uint d, UIntPtr e); }'
          function Save-Screen($path) {
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save($path)
          }
          function Test-Port { try { $c = [Net.Sockets.TcpClient]::new(); $c.Connect("127.0.0.1", 17878); $c.Close(); $true } catch { $false } }
          $monitors = [System.Windows.Forms.SystemInformation]::MonitorCount
          "monitors before: $monitors"

          # No redirection: like a double-click, serve gets its own console as stdin.
          $p = Start-Process -FilePath "$dir\spareglass.exe" -ArgumentList "serve","-addr","127.0.0.1:17878" -WorkingDirectory $dir -PassThru

          # Windows asks "Would you like to install this device software?" even
          # for the signed driver; on this throwaway VM the step clicks Install.
          $clicked = 0
          $deadline = (Get-Date).AddSeconds(240)
          while (-not (Test-Port) -and -not $p.HasExited -and (Get-Date) -lt $deadline) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $w = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Windows Security")))
              if ($w) {
                $btn = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Install")))
                if ($btn) {
                  # The dialog's button has no Invoke pattern: click its centre with a real mouse event.
                  $pt = $btn.GetClickablePoint()
                  [Mouse]::SetCursorPos([int]$pt.X, [int]$pt.Y) | Out-Null
                  Start-Sleep -Milliseconds 300
                  [Mouse]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [Mouse]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
                  $clicked++; "clicked Install ($clicked) at " + (Get-Date -Format o); Start-Sleep -Seconds 4
                }
              }
            } catch { "ui automation: $_" }
            Start-Sleep -Milliseconds 500
          }
          $listening = Test-Port
          $after = [System.Windows.Forms.SystemInformation]::MonitorCount
          Start-Sleep -Seconds 10
          $later = [System.Windows.Forms.SystemInformation]::MonitorCount
          Save-Screen (Join-Path $frames "first-run.png")
          Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          "listening: $listening  serve exited early: $($p.HasExited)  monitors when listening: $after  10 s later: $later"
          $log = Join-Path ([IO.Path]::GetTempPath()) "spareglass-driver-setup.log"
          "--- setup log: installed files and run entries"; Select-String -Path $log -Pattern "Dest filename:|Filename:|Parameters:" | ForEach-Object Line
          if (-not $listening) { "serve did not start listening"; exit 1 }
          if (-not (Test-Path C:\VirtualDisplayDriver\MttVDD.dll)) { "driver files are missing (did serve see a console?)"; exit 1 }
          if (Test-Path C:\VirtualDisplayDriver\ControlApp\VDDControl.exe) { "VDD Control was installed"; exit 1 }
          if (Get-Process VDDControl -ErrorAction SilentlyContinue) { "VDD Control is running"; exit 1 }
          if ($after -ne $monitors -or $later -ne $monitors) { "the driver's display stayed on the desktop"; exit 1 }
      - name: A second install-driver leaves the installed driver alone
        shell: bash
        run: |
          set -euo pipefail
          if "$RUNNER_TEMP/sg テスト/spareglass.exe" install-driver </dev/null >again.log 2>&1; then
            cat again.log; echo "install-driver ran the setup again"; exit 1
          fi
          cat again.log
          grep -q "already installed" again.log
      - name: Virtual display as a standard (non-admin) user
        shell: pwsh
        run: |
          $dir = "C:\sgcheck"
          New-Item -ItemType Directory -Force $dir | Out-Null
          Copy-Item third_party\windows\ffmpeg.exe $dir
          go test -c -o "$dir\vdisplay.test.exe" ./internal/vdisplay
          if ($LASTEXITCODE) { exit 1 }
          @'
          $ErrorActionPreference = "Continue"
          $id = [Security.Principal.WindowsIdentity]::GetCurrent()
          "user: $($id.Name) admin: $(([Security.Principal.WindowsPrincipal]$id).IsInRole('Administrators'))"
          try { [IO.File]::Open("C:\VirtualDisplayDriver\vdd_settings.xml", "Open", "ReadWrite").Close(); "settings: writable" } catch { "settings: $_" }
          try { $p = [IO.Pipes.NamedPipeClientStream]::new(".", "MTTVirtualDisplayPipe", "InOut"); $p.Connect(5000); $p.Close(); "pipe: connected" } catch { "pipe: $_" }
          $env:SPAREGLASS_VDD_TEST = "1"
          & C:\sgcheck\vdisplay.test.exe "-test.v" "-test.run=TestVDDDisplayStreams" 2>&1
          '@ | Set-Content "$dir\check.ps1"
          icacls $dir /grant "*S-1-1-0:(OI)(CI)F" | Out-Null

          $pw = "Sg-" + [guid]::NewGuid().ToString("N").Substring(0, 16) + "!a1"
          $sec = ConvertTo-SecureString $pw -AsPlainText -Force
          New-LocalUser -Name sgstd -Password $sec -AccountNeverExpires | Out-Null
          Add-LocalGroupMember -Group Users -Member sgstd
          $cred = [PSCredential]::new("$env:COMPUTERNAME\sgstd", $sec)
          $p = Start-Process powershell -Credential $cred -LoadUserProfile -WorkingDirectory $dir -ArgumentList "-NoProfile", "-ExecutionPolicy", "Bypass", "-File", "$dir\check.ps1" -RedirectStandardOutput "$dir\out.txt" -RedirectStandardError "$dir\err.txt" -Wait -PassThru
          "exit: $($p.ExitCode)"
          Get-Content "$dir\out.txt", "$dir\err.txt"
          $out = Get-Content -Raw "$dir\out.txt"
          if ($out -notmatch "admin: False") { "not a standard user"; exit 1 }
          if ($out -notmatch "settings: writable") { exit 1 }
          if ($out -notmatch "pipe: connected") { exit 1 }
          if ($out -notmatch "--- PASS: TestVDDDisplayStreams") { exit 1 }
          if ((Get-Content -Raw C:\VirtualDisplayDriver\vdd_settings.xml) -notmatch "<!-- spareglass -->") { "the standard user did not add a resolution"; exit 1 }
      - name: Virtual display tests (create, stream, resize, detach, WebRTC)
        shell: bash
        env:
          SPAREGLASS_VDD_TEST: "1"
        run: |
          set -euo pipefail
          mkdir -p vdd-frames
          export SPAREGLASS_VDD_FRAMES="$PWD/vdd-frames"
          dir=$(mktemp -d)
          cp third_party/windows/ffmpeg.exe "$dir/"
          go test -c -o "$dir/vdisplay.test.exe" ./internal/vdisplay
          go test -c -o "$dir/server.test.exe" ./internal/server
          cd "$dir"
          ./vdisplay.test.exe -test.v -test.run VDD | tee test.log
          ./server.test.exe -test.v -test.run TestStreamsVirtualDisplay | tee -a test.log
          grep -q -- "--- PASS: TestVDDDisplayStreams" test.log
          grep -q -- "--- PASS: TestStreamsVirtualDisplay" test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vdd-frames
          path: vdd-frames
          retention-days: 7

  goreleaser:
    needs: [ffmpeg-macos, ffmpeg-windows, windows-pipeline, windows-vdd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-macos
          path: third_party/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - run: packaging/windows/fetch-vdd.sh third_party/windows
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.20.2
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: inputs.snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7

  # Unpack the archives a person would download and run them as-is.
  archive-smoke:
    permissions:
      contents: read
    if: inputs.snapshot
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: windows_x64
            files: spareglass.exe ffmpeg.exe driver/VirtualDisplayDriver-setup.exe HOW-TO-USE.txt
          - os: macos-latest
            archive: mac
            files: spareglass ffmpeg "Start spareglass.command" HOW-TO-USE.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-archives
      - name: Unpack and run doctor
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          unzip -q ./*_${{ matrix.archive }}.zip -d unpacked
          cd unpacked/*/
          for f in ${{ matrix.files }}; do test -e "$f" || { echo "missing $f"; exit 1; }; done
          if compgen -G "*setup*" >/dev/null; then echo "an installer sits next to spareglass"; exit 1; fi
          ./spareglass doctor | tee doctor.txt
          grep "Capture/encode" doctor.txt | grep -q unpacked
          ! grep "Capture/encode" doctor.txt | grep -q "NOT AVAILABLE"
