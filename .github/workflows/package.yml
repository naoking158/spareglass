name: package

# Builds the release archives. release.yml calls it with snapshot: false on
# v* tags (publishes the GitHub Release); ci.yml calls it with snapshot: true
# so every change exercises the same path and uploads the archives as an artifact.
on:
  workflow_call:
    inputs:
      snapshot:
        type: boolean
        required: true

# The caller grants the token (read in CI, contents: write for releases). Only
# the goreleaser job inherits it; every other job is limited to read.
jobs:
  ffmpeg-macos:
    permissions:
      contents: read
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/macos
          key: ffmpeg-macos-${{ hashFiles('packaging/macos/build-ffmpeg.sh') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: packaging/macos/build-ffmpeg.sh third_party/macos
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - name: Pipeline tests against the bundled ffmpeg only
        shell: bash
        run: |
          set -euo pipefail
          lipo -info third_party/macos/ffmpeg
          dir=$(mktemp -d)
          cp third_party/macos/ffmpeg "$dir/"
          go test -c -o "$dir/media.test" ./internal/media
          cd "$dir" && PATH=/usr/bin:/bin ./media.test -test.v -test.run FFmpeg | tee test.log
          ! grep -q -- "--- SKIP" test.log
          grep -q -- "--- PASS" test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-macos
          path: third_party/macos
          retention-days: 1

  ffmpeg-windows:
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - id: cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: third_party/windows
          key: ffmpeg-windows-${{ hashFiles('packaging/windows/build-ffmpeg.sh', 'packaging/windows/ffmpeg.manifest') }}
      - if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq mingw-w64 >/dev/null
          packaging/windows/build-ffmpeg.sh third_party/windows
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ffmpeg-windows
          path: third_party/windows
          retention-days: 1

  windows-pipeline:
    permissions:
      contents: read
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - name: Pipeline tests against the bundled ffmpeg only
        shell: bash
        run: |
          set -euo pipefail
          dir=$(mktemp -d)
          cp third_party/windows/ffmpeg.exe "$dir/"
          go test -c -o "$dir/media.test.exe" ./internal/media
          go test -c -o "$dir/server.test.exe" ./internal/server
          cd "$dir"
          PATH=/usr/bin:/bin ./media.test.exe -test.v | tee test.log
          PATH=/usr/bin:/bin ./server.test.exe -test.v -test.run TestStreamsVideo | tee -a test.log
          ! grep -q -- "--- SKIP" test.log
          grep -q -- "--- PASS: TestPipelineCapturesPrimaryMonitor" test.log
          grep -q -- "--- PASS: TestStreamsVideo" test.log
      - name: A second host refuses to start
        shell: bash
        run: |
          set -euo pipefail
          go build -o spareglass.exe ./cmd/spareglass
          ./spareglass.exe serve -addr 127.0.0.1:0 </dev/null >first.log 2>&1 &
          first=$!
          for _ in $(seq 50); do grep -q "spareglass is running" first.log && break; sleep 0.2; done
          grep -q "spareglass is running" first.log
          if ./spareglass.exe serve -addr 127.0.0.1:0 </dev/null >second.log 2>&1; then
            echo "second host started"; cat second.log; exit 1
          fi
          cat second.log
          grep -q "already running" second.log
          kill "$first"

  windows-vdd:
    permissions:
      contents: read
    needs: ffmpeg-windows
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - name: Fetch the Virtual Display Driver shipped in the archives
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: packaging/windows/fetch-vdd.sh "$RUNNER_TEMP/vdd"
      - name: Install the Virtual Display Driver
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $f = Join-Path $env:RUNNER_TEMP "vdd\VirtualDisplayDriver-setup.exe"

          # Windows asks "Would you like to install this device software?" even
          # for the signed driver; on this throwaway VM the step clicks Install.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Mouse { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, int dx, int dy, uint d, UIntPtr e); }'
          $p = Start-Process -FilePath $f -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG=$env:RUNNER_TEMP\vdd-install.log" -PassThru
          $clicked = 0
          $deadline = (Get-Date).AddSeconds(240)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $w = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Windows Security")))
              if ($w) {
                $btn = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Install")))
                if ($btn) {
                  # The dialog's button has no Invoke pattern: click its centre with a real mouse event.
                  $pt = $btn.GetClickablePoint()
                  [Mouse]::SetCursorPos([int]$pt.X, [int]$pt.Y) | Out-Null
                  Start-Sleep -Milliseconds 300
                  [Mouse]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [Mouse]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
                  $clicked++; "clicked Install ($clicked) at " + (Get-Date -Format o); Start-Sleep -Seconds 4
                }
              }
            } catch { "ui automation: $_" }
            Start-Sleep -Milliseconds 500
          }
          if (-not $p.HasExited) {
            "!! installer still running after 240 s"
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\hang.png")
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 10
          "--- install log (last lines)"; Get-Content "$env:RUNNER_TEMP\vdd-install.log" -ErrorAction SilentlyContinue | Select-Object -Last 12
          "--- settings file"; Test-Path C:\VirtualDisplayDriver\vdd_settings.xml
      - name: Virtual display tests (create, stream, resize, detach, WebRTC)
        shell: bash
        env:
          SPAREGLASS_VDD_TEST: "1"
        run: |
          set -euo pipefail
          mkdir -p vdd-frames
          export SPAREGLASS_VDD_FRAMES="$PWD/vdd-frames"
          dir=$(mktemp -d)
          cp third_party/windows/ffmpeg.exe "$dir/"
          go test -c -o "$dir/vdisplay.test.exe" ./internal/vdisplay
          go test -c -o "$dir/server.test.exe" ./internal/server
          cd "$dir"
          ./vdisplay.test.exe -test.v -test.run VDD | tee test.log
          ./server.test.exe -test.v -test.run TestStreamsVirtualDisplay | tee -a test.log
          grep -q -- "--- PASS: TestVDDDisplayStreams" test.log
          grep -q -- "--- PASS: TestStreamsVirtualDisplay" test.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: vdd-frames
          path: vdd-frames
          retention-days: 7

  goreleaser:
    needs: [ffmpeg-macos, ffmpeg-windows, windows-pipeline, windows-vdd]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-macos
          path: third_party/macos
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ffmpeg-windows
          path: third_party/windows
      - run: packaging/windows/fetch-vdd.sh third_party/windows
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: goreleaser/goreleaser-action@e435ccd777264be153ace6237001ef4d979d3a7a # v6.4.0
        with:
          version: v2.20.2
          args: release --clean ${{ inputs.snapshot && '--snapshot' || '' }}
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - if: inputs.snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-archives
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/checksums.txt
          retention-days: 7

  # Unpack the archives a person would download and run them as-is.
  archive-smoke:
    permissions:
      contents: read
    if: inputs.snapshot
    needs: goreleaser
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            archive: windows_x64
            files: spareglass.exe ffmpeg.exe VirtualDisplayDriver-setup.exe HOW-TO-USE.txt
          - os: macos-latest
            archive: mac
            files: spareglass ffmpeg "Start spareglass.command" HOW-TO-USE.txt
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-archives
      - name: Unpack and run doctor
        shell: bash
        run: |
          set -euo pipefail
          mkdir unpacked
          unzip -q ./*_${{ matrix.archive }}.zip -d unpacked
          cd unpacked/*/
          for f in ${{ matrix.files }}; do test -e "$f" || { echo "missing $f"; exit 1; }; done
          ./spareglass doctor | tee doctor.txt
          grep "Capture/encode" doctor.txt | grep -q unpacked
          ! grep "Capture/encode" doctor.txt | grep -q "NOT AVAILABLE"
