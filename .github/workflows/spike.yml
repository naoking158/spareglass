name: spike-windows-vdd
on:
  push:
    branches: [spike/**]
permissions:
  contents: read
jobs:
  spike:
    runs-on: windows-latest
    steps:

      - name: Install Virtual Display Driver 25.5.2 (pinned, hash-checked)
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Get-ChildItem Cert:\LocalMachine\Root, Cert:\LocalMachine\TrustedPublisher | Select-Object -ExpandProperty Thumbprint | Sort-Object | Out-File $env:RUNNER_TEMP\certs-before.txt
          $dir = Join-Path $env:RUNNER_TEMP "vdd"; New-Item -ItemType Directory -Force $dir | Out-Null
          gh release download 25.5.2 --repo VirtualDrivers/Virtual-Display-Driver -p "Virtual.Display.Driver-v25.05.03-setup-x64.exe" -D $dir
          $f = Join-Path $dir "Virtual.Display.Driver-v25.05.03-setup-x64.exe"
          $h = (Get-FileHash $f -Algorithm SHA256).Hash.ToLower()
          "sha256: $h"
          if ($h -ne "ca10b85babecfb636c85b3f04d2306968d4f940dd3dd35767f866207bfba846e") { throw "unexpected installer hash" }

          # The driver is signed (publisher: SignPath Foundation) but Windows still asks a human:
          # "Would you like to install this device software?". On this throwaway VM we click Install.
          Add-Type -AssemblyName UIAutomationClient, UIAutomationTypes
          Add-Type -TypeDefinition 'using System; using System.Runtime.InteropServices; public class Mouse { [DllImport("user32.dll")] public static extern bool SetCursorPos(int x, int y); [DllImport("user32.dll")] public static extern void mouse_event(uint f, int dx, int dy, uint d, UIntPtr e); }'
          $p = Start-Process -FilePath $f -ArgumentList "/VERYSILENT","/SUPPRESSMSGBOXES","/NORESTART","/SP-","/LOG=$env:RUNNER_TEMP\vdd-install.log" -PassThru
          $clicked = 0
          $deadline = (Get-Date).AddSeconds(240)
          while (-not $p.HasExited -and (Get-Date) -lt $deadline) {
            try {
              $root = [System.Windows.Automation.AutomationElement]::RootElement
              $w = $root.FindFirst([System.Windows.Automation.TreeScope]::Children, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Windows Security")))
              if ($w) {
                $btn = $w.FindFirst([System.Windows.Automation.TreeScope]::Descendants, (New-Object System.Windows.Automation.PropertyCondition([System.Windows.Automation.AutomationElement]::NameProperty, "Install")))
                if ($btn) {
                  # The dialog's button has no Invoke pattern: click its centre with a real mouse event.
                  $pt = $btn.GetClickablePoint()
                  [Mouse]::SetCursorPos([int]$pt.X, [int]$pt.Y) | Out-Null
                  Start-Sleep -Milliseconds 300
                  [Mouse]::mouse_event(2, 0, 0, 0, [UIntPtr]::Zero); [Mouse]::mouse_event(4, 0, 0, 0, [UIntPtr]::Zero)
                  $clicked++; "clicked Install ($clicked) at " + (Get-Date -Format o); Start-Sleep -Seconds 4
                }
              }
            } catch { "ui automation: $_" }
            Start-Sleep -Milliseconds 500
          }
          if (-not $p.HasExited) {
            "!! installer still running after 240 s"
            Add-Type -AssemblyName System.Windows.Forms, System.Drawing
            $b = [System.Windows.Forms.SystemInformation]::VirtualScreen
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp); $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save("$env:RUNNER_TEMP\hang.png")
            Stop-Process -Id $p.Id -Force -ErrorAction SilentlyContinue
          }
          Start-Sleep -Seconds 10
          "--- install log (last lines)"; Get-Content "$env:RUNNER_TEMP\vdd-install.log" -ErrorAction SilentlyContinue | Select-Object -Last 12
          "--- settings file"; Test-Path C:\VirtualDisplayDriver\vdd_settings.xml
      - name: Display helpers
        shell: pwsh
        run: |
          @'
          using System; using System.Runtime.InteropServices; using System.Collections.Generic;
          public class Disp {
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)] public struct DISPLAY_DEVICE { public int cb; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string DeviceName; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceString; public int StateFlags; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceID; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=128)] public string DeviceKey; }
            [StructLayout(LayoutKind.Sequential, CharSet=CharSet.Unicode)] public struct DEVMODE { [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmDeviceName; public short dmSpecVersion; public short dmDriverVersion; public short dmSize; public short dmDriverExtra; public int dmFields; public int dmPositionX; public int dmPositionY; public int dmDisplayOrientation; public int dmDisplayFixedOutput; public short dmColor; public short dmDuplex; public short dmYResolution; public short dmTTOption; public short dmCollate; [MarshalAs(UnmanagedType.ByValTStr, SizeConst=32)] public string dmFormName; public short dmLogPixels; public int dmBitsPerPel; public int dmPelsWidth; public int dmPelsHeight; public int dmDisplayFlags; public int dmDisplayFrequency; public int dmICMMethod; public int dmICMIntent; public int dmMediaType; public int dmDitherType; public int dmReserved1; public int dmReserved2; public int dmPanningWidth; public int dmPanningHeight; }
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool EnumDisplayDevices(string dev, int i, ref DISPLAY_DEVICE dd, int flags);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern bool EnumDisplaySettings(string dev, int mode, ref DEVMODE dm);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int ChangeDisplaySettingsEx(string dev, ref DEVMODE dm, IntPtr hwnd, int flags, IntPtr lp);
            [DllImport("user32.dll", CharSet=CharSet.Unicode)] public static extern int ChangeDisplaySettingsEx(string dev, IntPtr dm, IntPtr hwnd, int flags, IntPtr lp);
            public static List<string> List() { var r = new List<string>(); for (int i=0;;i++){ var d=new DISPLAY_DEVICE(); d.cb=Marshal.SizeOf(d); if(!EnumDisplayDevices(null,i,ref d,0)) break; var m=new DEVMODE(); m.dmSize=(short)Marshal.SizeOf(m); string cur = EnumDisplaySettings(d.DeviceName,-1,ref m) ? (m.dmPelsWidth+"x"+m.dmPelsHeight+" at "+m.dmPositionX+","+m.dmPositionY) : "-"; r.Add(d.DeviceName+" | "+d.DeviceString+" | flags=0x"+d.StateFlags.ToString("x")+" | "+cur); } return r; }
            public static List<string> Modes(string dev) { var r=new List<string>(); for(int i=0;;i++){ var m=new DEVMODE(); m.dmSize=(short)Marshal.SizeOf(m); if(!EnumDisplaySettings(dev,i,ref m)) break; r.Add(m.dmPelsWidth+"x"+m.dmPelsHeight+"@"+m.dmDisplayFrequency); } return r; }
            public static int Set(string dev, int w, int h, int x, int y) { var m=new DEVMODE(); m.dmSize=(short)Marshal.SizeOf(m); m.dmPelsWidth=w; m.dmPelsHeight=h; m.dmPositionX=x; m.dmPositionY=y; m.dmFields=0x80000|0x100000|0x20; int r=ChangeDisplaySettingsEx(dev,ref m,IntPtr.Zero,0x1|0x10000000,IntPtr.Zero); if(r!=0) return r; return ChangeDisplaySettingsEx(null,IntPtr.Zero,IntPtr.Zero,0,IntPtr.Zero); }
          }
          '@ | Set-Content $env:RUNNER_TEMP\disp.cs
          @'
          function Pipe([string]$cmd) { $c = New-Object System.IO.Pipes.NamedPipeClientStream(".", "MTTVirtualDisplayPipe", [System.IO.Pipes.PipeDirection]::InOut); $c.Connect(3000); $b=[System.Text.Encoding]::Unicode.GetBytes($cmd); $c.Write($b,0,$b.Length); $c.Flush(); $buf=New-Object byte[] 1024; $c.ReadTimeout=3000; $n=0; try { $n=$c.Read($buf,0,1024) } catch { "read: $_" }; $c.Close(); [System.Text.Encoding]::Unicode.GetString($buf,0,$n) }
          '@ | Set-Content $env:RUNNER_TEMP\pipe.ps1
      - name: Probe and add 1180x820
        shell: pwsh
        run: |
          Add-Type -Path $env:RUNNER_TEMP\disp.cs; . $env:RUNNER_TEMP\pipe.ps1
          "PING -> " + (Pipe "PING")
          "--- displays"; [Disp]::List()
          "--- settings xml"; Get-Content C:\VirtualDisplayDriver\vdd_settings.xml | Select-Object -First 40
          "--- acl"; icacls C:\VirtualDisplayDriver
          [xml]$x = Get-Content C:\VirtualDisplayDriver\vdd_settings.xml
          $r = $x.CreateElement("resolution"); foreach ($kv in @(@("width","1180"),@("height","820"),@("refresh_rate","60"))) { $e=$x.CreateElement($kv[0]); $e.InnerText=$kv[1]; [void]$r.AppendChild($e) }
          [void]$x.vdd_settings.resolutions.AppendChild($r); $x.Save("C:\VirtualDisplayDriver\vdd_settings.xml")
          "RELOAD -> " + (Pipe "RELOAD_DRIVER")
          for ($i=0; $i -lt 20; $i++) { Start-Sleep 1; try { if ((Pipe "PING") -match "PONG") { "pong after $i s"; break } } catch { "wait $i" } }
          Start-Sleep 3
          "--- displays after reload"; [Disp]::List()
          $vdd = [Disp]::List() | Where-Object { $_ -match "Virtual Display" -or $_ -match "MTT|IddSample|VDD" } | Select-Object -First 1
          "vdd line: $vdd"
          $dev = ($vdd -split " \| ")[0]
          "--- modes of $dev"; [Disp]::Modes($dev) | Sort-Object -Unique | Select-Object -First 60
          "set -> " + [Disp]::Set($dev, 1180, 820, 1024, 0)
          Start-Sleep 2
          "--- displays after set"; [Disp]::List()
          "$dev" | Set-Content $env:RUNNER_TEMP\dev.txt
      - name: ffmpeg capture
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          Add-Type -Path $env:RUNNER_TEMP\disp.cs
          gh release download latest --repo BtbN/FFmpeg-Builds -p "ffmpeg-master-latest-win64-lgpl.zip" -D $env:RUNNER_TEMP
          Expand-Archive $env:RUNNER_TEMP\ffmpeg-master-latest-win64-lgpl.zip $env:RUNNER_TEMP\ff
          $ff = (Get-ChildItem $env:RUNNER_TEMP\ff -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          & $ff -hide_banner -version | Select-Object -First 1
          mkdir out | Out-Null
          [Disp]::List()
          "--- gdigrab region 1024,0 1180x820 + libopenh264"
          & $ff -hide_banner -nostdin -loglevel warning -f gdigrab -framerate 30 -offset_x 1024 -offset_y 0 -video_size 1180x820 -draw_mouse 1 -i desktop -t 3 -c:v libopenh264 -b:v 6M -g 30 -bf 0 -f h264 out/gdi_openh264.h264; "rc=$LASTEXITCODE"
          "--- gdigrab + h264_mf"
          & $ff -hide_banner -nostdin -loglevel warning -f gdigrab -framerate 30 -offset_x 1024 -offset_y 0 -video_size 1180x820 -i desktop -t 3 -c:v h264_mf -b:v 6M -g 30 -bf 0 -pix_fmt nv12 -f h264 out/gdi_mf.h264; "rc=$LASTEXITCODE"
          "--- ddagrab output_idx=1"
          & $ff -hide_banner -nostdin -loglevel warning -filter_complex "ddagrab=output_idx=1:framerate=30,hwdownload,format=bgra" -t 3 -c:v libopenh264 -b:v 6M -f h264 out/dda.h264; "rc=$LASTEXITCODE"
          Get-ChildItem out | Format-Table Name, Length
          foreach ($f in Get-ChildItem out -Filter *.h264) { & $ff -hide_banner -nostdin -loglevel error -i $f.FullName -vf "select=eq(n\,30)" -frames:v 1 ("out/" + $f.BaseName + ".png") }
          Copy-Item $ff out/ -ErrorAction SilentlyContinue; Remove-Item out/ffmpeg.exe
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: spike-out
          path: out
