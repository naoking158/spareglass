# GoReleaser v2 — builds the archives attached to each GitHub Release.
# Run by .github/workflows/package.yml (release on v* tags, snapshot in CI).
#
# Archives are named for people, not toolchains: one universal "mac" zip and
# one "windows_x64" zip (the bundled driver installer and ffmpeg are x64
# only). Both ship an LGPL ffmpeg that packaging/{macos,windows}/build-ffmpeg.sh
# builds into third_party/ beforehand.
version: 2

project_name: spareglass

before:
  hooks:
    - go mod tidy

builds:
  - id: mac
    main: ./cmd/spareglass
    binary: spareglass
    env: &env
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: &flags
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

  - id: windows
    main: ./cmd/spareglass
    binary: spareglass
    env: *env
    goos: [windows]
    goarch: [amd64]
    flags: *flags
    ldflags: *ldflags

  - id: other
    main: ./cmd/spareglass
    binary: spareglass
    env: *env
    goos: [linux]
    goarch: [amd64, arm64]
    flags: *flags
    ldflags: *ldflags

universal_binaries:
  - id: mac
    ids: [mac]
    replace: true

archives:
  - id: mac
    ids: [mac]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_mac"
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - src: third_party/macos/ffmpeg
        strip_parent: true
        info:
          mode: 0755
      - src: third_party/macos/ffmpeg-LICENSE.txt
        strip_parent: true
      - src: packaging/macos/HOW-TO-USE.txt
        strip_parent: true
      - src: packaging/macos/Start spareglass.command
        strip_parent: true
        info:
          mode: 0755

  - id: windows
    ids: [windows]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_windows_{{ if eq .Arch \"amd64\" }}x64{{ else }}{{ .Arch }}{{ end }}"
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - src: third_party/windows/ffmpeg.exe
        strip_parent: true
      - src: third_party/windows/ffmpeg-LICENSE.txt
        strip_parent: true
      - src: third_party/windows/VirtualDisplayDriver-setup.exe
        strip_parent: true
      - src: third_party/windows/VirtualDisplayDriver-LICENSE.txt
        strip_parent: true
      - src: packaging/windows/HOW-TO-USE.txt
        strip_parent: true

  - id: other
    ids: [other]
    formats: [tar.gz]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  header: |
    ## ダウンロード / Download

    | パソコン | ファイル |
    |---|---|
    | Mac (macOS 14 以降) | `spareglass_{{ .Version }}_mac.zip` |
    | Windows 10 / 11 | `spareglass_{{ .Version }}_windows_x64.zip` |

    ダウンロードしたら展開（ダブルクリック）して、フォルダの中の `HOW-TO-USE.txt` を読んでください。
    Extract the zip and follow `HOW-TO-USE.txt` inside the folder.
  draft: false
  prerelease: auto
