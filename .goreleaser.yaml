# GoReleaser v2 — builds the archives attached to each GitHub Release.
# Run by .github/workflows/package.yml (release on v* tags, snapshot in CI).
#
# Archives are named for people, not toolchains: one universal "mac" zip and
# "windows_x64" / "windows_arm64" zips. The mac zip ships an LGPL ffmpeg that
# packaging/macos/build-ffmpeg.sh builds into third_party/macos/ beforehand.
version: 2

project_name: spareglass

before:
  hooks:
    - go mod tidy

builds:
  - id: mac
    main: ./cmd/spareglass
    binary: spareglass
    env: &env
      - CGO_ENABLED=0
    goos: [darwin]
    goarch: [amd64, arm64]
    flags: &flags
      - -trimpath
    ldflags: &ldflags
      - -s -w -X main.version={{.Version}} -X main.commit={{.ShortCommit}} -X main.date={{.Date}}

  - id: other
    main: ./cmd/spareglass
    binary: spareglass
    env: *env
    goos: [windows, linux]
    goarch: [amd64, arm64]
    flags: *flags
    ldflags: *ldflags

universal_binaries:
  - id: mac
    ids: [mac]
    replace: true

archives:
  - id: mac
    ids: [mac]
    formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_mac"
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE
      - src: third_party/macos/ffmpeg
        strip_parent: true
        info:
          mode: 0755
      - src: third_party/macos/ffmpeg-LICENSE.txt
        strip_parent: true

  - id: other
    ids: [other]
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      {{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ if eq .Arch "amd64" }}x64{{ else }}{{ .Arch }}{{ end }}
    wrap_in_directory: true
    files:
      - README.md
      - LICENSE

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^chore:"
      - "^test:"

release:
  draft: false
  prerelease: auto
