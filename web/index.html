<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2a33">
  <title>spareglass</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <video id="screen" autoplay playsinline muted></video>

  <main id="panel">
    <h1>Use this screen as a display</h1>
    <p id="status">Ready to connect.</p>
    <button id="connect" type="button">Connect</button>
    <p class="hint">Connecting switches to full screen. Exit full screen or close this tab to disconnect.</p>
  </main>

  <script src="app.js"></script>
</body>
</html>
