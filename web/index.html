<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1e2a33">
  <title>spareglass</title>
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <video id="screen" autoplay playsinline muted></video>
  <svg id="cursor" viewBox="0 0 14 20" hidden aria-hidden="true">
    <path d="M1 1V16.5L4.9 12.8L7.5 18.7L10.1 17.6L7.5 11.8H12.8Z" fill="#000" stroke="#fff" stroke-width="1.1" stroke-linejoin="round"/>
  </svg>

  <main id="panel">
    <h1 id="title">Use this screen as display 1</h1>
    <p id="code" hidden aria-live="assertive"></p>
    <p id="status" role="status">Ready to connect.</p>
    <button id="connect" type="button">Connect</button>
    <p class="hint">Connecting switches to full screen. Exit full screen or close this tab to disconnect.</p>
  </main>

  <script src="/app.js"></script>
</body>
</html>
